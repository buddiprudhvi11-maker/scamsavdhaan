// lib/scanner.ts

export type LanguageCode = "en" | "hi" | "te" | "ta";

export type RiskLevel = "HIGH_RISK" | "SUSPICIOUS" | "SAFE";

export type HighlightCategory = "urgency" | "link_apk" | "financial_kyc";

export interface HighlightSegment {
  id: string;
  text: string;
  isHighlight: boolean;
  category?: HighlightCategory;
  label?: string;
  explanation?: string;
}

export interface ScanResult {
  riskLevel: RiskLevel;
  threatScore: number; // 0 to 100
  metrics: {
    urgencyScore: number;
    urgencySummary: string;
    linkSafetyStatus: string;
    linkSafetyLevel: "danger" | "warning" | "safe";
    senderCredibility: string;
    senderCredibilityLevel: "danger" | "warning" | "safe";
  };
  segments: HighlightSegment[];
  redFlagsCount: {
    urgency: number;
    link_apk: number;
    financial_kyc: number;
  };
  aiVerdict: string;
  scamCategory: string;
  detectedUrls: string[];
  senderAnalyzed: string;
}

export interface DemoPreset {
  id: string;
  title: string;
  badge: string;
  senderId: string;
  suspiciousUrl: string;
  message: string;
}

export interface TrendingScam {
  id: string;
  title: string;
  frequency: string;
  riskLevel: "Critical" | "High" | "Elevated";
  channel: string;
  sampleMessage: string;
  howItWorks: string;
}

