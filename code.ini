interface RuleDefinition {
  regex: RegExp;
  category: HighlightCategory;
  label: string;
  explanation: string;
  weight: number;
}

const DETECTION_RULES: RuleDefinition[] = [
  // RED: Urgency & Coercion Triggers
  {
    regex:
      /\b(disconnected tonight at \d{1,2}:\d{2}\s*(?:AM|PM)?|disconnected tonight|disconnected|immediately|within 24 hours|blocked today|suspended today|court notice|arrest warrant|avoid disconnection|last warning)\b/gi,
    category: "urgency",
    label: "Artificial Panic & Urgency Trigger",
    explanation:
      "Scam syndicates manufacture a strict deadline (like 'tonight at 9:30 PM' or 'within 24 hours') so you act in panic without calling the official customer care number or consulting family.",
    weight: 30,
  },
  // ORANGE: Suspicious Links, WhatsApp Unknown Links & APK Downloads
  {
    regex:
      /(https?:\/\/(?:wa\.me|chat\.whatsapp\.com|api\.whatsapp\.com)\/[^\s]+|(?:wa\.me|chat\.whatsapp\.com)\/[^\s]+|https?:\/\/(?:bit\.ly|tinyurl\.com|is\.gd|t\.me)\/[^\s]+|(?:bit\.ly|tinyurl\.com|is\.gd)\/[^\s]+|https?:\/\/[a-zA-Z0-9-]+\.(?:xyz|top|club|online|site|info)(?:\/[^\s]*)?|[a-zA-Z0-9-]+-(?:kyc|tracking|online|update)\.(?:com|xyz|in)(?:\/[^\s]*)?|\b[A-Za-z0-9_-]+\.apk\b)/gi,
    category: "link_apk",
    label: "Suspicious Link / Unknown WhatsApp / Malware APK",
    explanation:
      "Banks, electricity boards, and India Post NEVER ask you to click unknown WhatsApp links (wa.me / chat.whatsapp.com), shortened URLs (bit.ly), '.xyz' domains, or install '.apk' files sent via chat.",
    weight: 45,
  },
  // YELLOW: Financial Bait, Sensitive KYC & Payout Lures
  {
    regex:
      /\b(Earn ₹\d+-\d+(?:\s*daily)?|Earn Rs\.?\s*\d+|part-time|lottery|PAN update|Aadhaar update|KYC update|credit card limit increased|pay ₹\d+|share OTP|UPI PIN|welcome payout)\b/gi,
    category: "financial_kyc",
    label: "Financial Lure or Sensitive Data Trap",
    explanation:
      "Promises of easy daily income ('Earn ₹3000-5000') or requests for PAN/KYC updates and small re-delivery fees ('pay ₹25') are designed to harvest your banking credentials or UPI PIN.",
    weight: 30,
  },
];

export function analyzeMessage(
  rawText: string,
  senderInput: string = "",
  urlInput: string = ""
): ScanResult {
  const combinedText = [
    rawText.trim(),
    urlInput.trim() && !rawText.includes(urlInput.trim())
      ? ` ${urlInput.trim()}`
      : "",
  ]
    .join("")
    .trim();

  // Check if message matches genuine Bank OTP pattern
  const isDefensiveOtpWarning =
    /do not share this otp|never ask for otp|is your secret one time password/i.test(
      combinedText
    );

  // Collect all regex matches with start/end indices
  interface MatchSpan {
    start: number;
    end: number;
    text: string;
    category: HighlightCategory;
    label: string;
    explanation: string;
    weight: number;
  }

  const spans: MatchSpan[] = [];

  for (const rule of DETECTION_RULES) {
    const regex = new RegExp(rule.regex.source, "gi");
    let match: RegExpExecArray | null;
    while ((match = regex.exec(combinedText)) !== null) {
      const start = match.index;
      const end = start + match[0].length;

      // Avoid overlapping spans
      const overlaps = spans.some((s) => start < s.end && end > s.start);
      if (!overlaps) {
        spans.push({
          start,
          end,
          text: match[0],
          category: rule.category,
          label: rule.label,
          explanation: rule.explanation,
          weight: rule.weight,
        });
      }
    }
  }

  spans.sort((a, b) => a.start - b.start);

  // Build segments for interactive highlighting
  const segments: HighlightSegment[] = [];
  let cursor = 0;
  spans.forEach((span, idx) => {
    if (span.start > cursor) {
      segments.push({
        id: `plain-${idx}`,
        text: combinedText.slice(cursor, span.start),
        isHighlight: false,
      });
    }
    segments.push({
      id: `hl-${idx}`,
      text: span.text,
      isHighlight: true,
      category: span.category,
      label: span.label,
      explanation: span.explanation,
    });
    cursor = span.end;
  });

  if (cursor < combinedText.length) {
    segments.push({
      id: `plain-end`,
      text: combinedText.slice(cursor),
      isHighlight: false,
    });
  }

  // Count flags by category
  const redFlagsCount = {
    urgency: spans.filter((s) => s.category === "urgency").length,
    link_apk: spans.filter((s) => s.category === "link_apk").length,
    financial_kyc: spans.filter((s) => s.category === "financial_kyc").length,
  };

  // Evaluate Sender ID credibility
  const cleanSender = senderInput.trim();
  const isPersonalMobile =
    /^(\+?91[-\s]?)?[6-9]\d{9}$/.test(cleanSender.replace(/\s+/g, "")) ||
    /\b(?:\+91[-\s]?)?[6-9]\d{9}\b/.test(combinedText);
  const isDltHeader = /^[A-Z]{2}-[A-Z0-9]{5,8}$/i.test(cleanSender);

  let senderCredibility = "Standard or Unspecified Sender";
  let senderCredibilityLevel: "danger" | "warning" | "safe" = "warning";
  let senderPenalty = 10;

  if (isPersonalMobile && !isDltHeader) {
    senderCredibility =
      "Personal 10-digit mobile number claiming to be an official institution or agent.";
    senderCredibilityLevel = "danger";
    senderPenalty = 30;
  } else if (isDltHeader && redFlagsCount.link_apk === 0) {
    senderCredibility = `Verified TRAI DLT Commercial Header (${cleanSender.toUpperCase()}).`;
    senderCredibilityLevel = "safe";
    senderPenalty = 0;
  }

  // Evaluate Link Safety
  const hasWhatsAppUnknownLink =
    /wa\.me\/|chat\.whatsapp\.com\/|api\.whatsapp\.com/i.test(combinedText);
  const hasApk = /\.apk\b/i.test(combinedText);
  const hasShortenerOrXyz =
    /bit\.ly|tinyurl|is\.gd|\.xyz|\.top|sbi-online-kyc|indpost-tracking/i.test(
      combinedText
    );

  let linkSafetyStatus = "No external suspicious links or APKs found.";
  let linkSafetyLevel: "danger" | "warning" | "safe" = "safe";

  if (hasApk && hasWhatsAppUnknownLink) {
    linkSafetyStatus =
      "CRITICAL: Contains both an unknown WhatsApp link (wa.me/group) AND a dangerous .apk app file.";
    linkSafetyLevel = "danger";
  } else if (hasApk) {
    linkSafetyStatus =
      "CRITICAL: Directs you to install an unverified .apk file that can steal SMS & OTPs.";
    linkSafetyLevel = "danger";
  } else if (hasWhatsAppUnknownLink) {
    linkSafetyStatus =
      "High Risk: Redirects to an unverified WhatsApp chat (wa.me / chat.whatsapp.com) impersonating support.";
    linkSafetyLevel = "danger";
  } else if (hasShortenerOrXyz) {
    linkSafetyStatus =
      "Suspicious domain (Shortened bit.ly or deceptive .xyz / lookalike phishing domain).";
    linkSafetyLevel = "danger";
  }

  // Calculate Urgency Score & Overall Threat Score
  const urgencyScore = isDefensiveOtpWarning
    ? 5
    : Math.min(
        100,
        redFlagsCount.urgency * 45 +
          (redFlagsCount.link_apk > 0 ? 25 : 0) +
          (redFlagsCount.financial_kyc > 0 ? 15 : 0)
      );

  let rawThreat =
    spans.reduce((acc, s) => acc + s.weight, 0) + senderPenalty;

  if (isDefensiveOtpWarning && redFlagsCount.link_apk === 0) {
    rawThreat = 8;
    senderCredibilityLevel = "safe";
    if (!cleanSender) {
      senderCredibility =
        "Standard transactional bank alert format with anti-fraud warning.";
    }
  }

  const threatScore = Math.max(5, Math.min(99, rawThreat));

  let riskLevel: RiskLevel = "SAFE";
  if (threatScore >= 60) {
    riskLevel = "HIGH_RISK";
  } else if (threatScore >= 30) {
    riskLevel = "SUSPICIOUS";
  }

  // Generate AI Plain-Language Verdict (2 conversational sentences)
  let scamCategory = "General Advisory";
  let aiVerdict =
    "This message appears to be a standard transactional alert with no phishing links or coercive demands. Still, never share your OTP or UPI PIN with anyone claiming to be from a bank.";

  if (riskLevel === "HIGH_RISK") {
    if (/electricity|power|bill/i.test(combinedText)) {
      scamCategory = "Utility Disconnection Scam";
      aiVerdict =
        "This is a classic utility disconnection scam designed to make you panic at night. Genuine electricity boards never send disconnection notices from personal 10-digit mobile numbers or ask you to message an unofficial WhatsApp link or download an .apk file.";
    } else if (/part-time|earn|youtube|telegram|task/i.test(combinedText)) {
      scamCategory = "WhatsApp / Telegram Prepaid Task Scam";
      aiVerdict =
        "This is a deceptive 'Work from Home' task scam that uses unknown WhatsApp links and small initial payouts to win your trust. Fraudsters eventually trap victims into paying thousands of rupees to unlock fake 'VIP task' commissions.";
    } else if (/india post|parcel|courier|warehouse|address/i.test(combinedText)) {
      scamCategory = "Fake Courier / India Post Phishing Scam";
      aiVerdict =
        "This is a parcel delivery phishing attack using a fake '.xyz' domain to steal your card or UPI credentials. India Post never asks citizens to pay a ₹25 address-update fee on non-government links (official website is indiapost.gov.in).";
    } else if (/challan|vahan|parivahan|\.apk/i.test(combinedText)) {
      scamCategory = "WhatsApp Malware (.APK) & Fake Challan Scam";
      aiVerdict =
        "This is a dangerous mobile malware attack disguised as a traffic e-Challan or KYC update on WhatsApp. Downloading the '.apk' file or clicking the unknown WhatsApp link gives scammers remote access to read your banking OTPs.";
    } else {
      scamCategory = "High-Risk Phishing & Impersonation Scam";
      aiVerdict =
        "This message uses urgent threats and unverified links to trick you into handing over money or personal KYC details. Official institutions never ask you to click shortened links or contact personal WhatsApp numbers.";
    }
  } else if (riskLevel === "SUSPICIOUS") {
    scamCategory = "Unverified Sender / Promotional Lure";
    aiVerdict =
      "This message contains pressure tactics or comes from an unverified sender number that requires caution. Verify the claim independently by typing the organization's official website directly into your browser before taking action.";
  }

  const detectedUrls = spans
    .filter((s) => s.category === "link_apk")
    .map((s) => s.text);

  return {
    riskLevel,
    threatScore,
    metrics: {
      urgencyScore,
      urgencySummary:
        urgencyScore >= 60
          ? `${urgencyScore}/100 (Artificial panic & deadline detected)`
          : urgencyScore >= 30
          ? `${urgencyScore}/100 (Moderate urgency language)`
          : `${urgencyScore}/100 (Calm, informational tone)`,
      linkSafetyStatus,
      linkSafetyLevel,
      senderCredibility,
      senderCredibilityLevel,
    },
    segments,
    redFlagsCount,
    aiVerdict,
    scamCategory,
    detectedUrls,
    senderAnalyzed: cleanSender || "Not specified (inferred from message)",
  };
}